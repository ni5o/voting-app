name: Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.backend
        push: true
        tags: ghcr.io/${{ github.repository }}/backend:latest

    - name: Build and push vote-frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.vote-frontend
        push: true
        tags: ghcr.io/${{ github.repository }}/vote-frontend:latest

    - name: Build and push result-frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.result-frontend
        push: true
        tags: ghcr.io/${{ github.repository }}/result-frontend:latest
